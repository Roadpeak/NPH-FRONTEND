name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nph-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_API_URL is the browser-visible backend URL — public by
          # construction (it ships in every JS bundle a visitor downloads),
          # so hardcoded here rather than kept as a secret. A missing /api/v1
          # suffix silently 404s every request; keeping it literal removes
          # one class of secret-editing mistakes.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nationalhealthportal.com/api/v1
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull image + recreate frontend on droplet
        uses: appleboy/ssh-action@v1
        env:
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 2222
          envs: FRONTEND_IMAGE_TAG,GHCR_PULL_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /home/deploy/nhp

            # Merge FRONTEND_IMAGE_TAG into the existing .env owned by the
            # backend workflow. Keep IMAGE_TAG (backend) untouched.
            if grep -q '^FRONTEND_IMAGE_TAG=' .env; then
              sudo sed -i "s|^FRONTEND_IMAGE_TAG=.*|FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_TAG}|" .env
            else
              echo "FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_TAG}" | sudo tee -a .env >/dev/null
            fi

            echo "${GHCR_PULL_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull + recreate frontend only. Never touches backend/postgres/nginx
            # config — those are the backend workflow's territory.
            # --force-recreate: `up -d` alone sometimes keeps the old container
            # when the image tag string is unchanged even though the digest
            # moved; force-recreate is what actually guarantees the new bundle
            # ships.
            sudo docker compose -f docker-compose.prod.yml pull frontend
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps frontend

            # nginx caches upstream DNS resolution — nudge it so the new
            # frontend container is picked up cleanly.
            sudo docker compose -f docker-compose.prod.yml restart nginx || true

            # Prune old frontend images. Keep the two newest by CreatedAt —
            # the just-deployed image (currently running) and the previous
            # one (rollback candidate). Everything older gets its layers
            # reclaimed. GHCR keeps the full history remotely; the droplet
            # does not need to.
            IMAGE_REPO="ghcr.io/roadpeak/nph-frontend"
            KEEP_IDS=$(sudo docker images "$IMAGE_REPO" --format '{{.CreatedAt}} {{.ID}}' \
              | sort -r \
              | awk '!seen[$NF]++ {print $NF}' \
              | head -2)
            sudo docker images "$IMAGE_REPO" --format '{{.ID}}' \
              | awk '!seen[$0]++' \
              | grep -vFx "$KEEP_IDS" \
              | xargs -r sudo docker rmi -f 2>&1 | tail -5 || true
            sudo docker image prune -f
            sudo docker compose -f docker-compose.prod.yml ps frontend
