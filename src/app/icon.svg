<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="National Health Portal">
  <!--
    The browser-tab mark: a health cross in the portal's blue.

    The flag colours it carried before were removed with the rest of the
    government branding — this deployment is not yet entitled to present
    itself as a government service, and a tab icon is as much a claim of
    provenance as a banner is.

    What survives from the earlier design is the constraint that produced
    it: one shape, nothing smaller than a fifth of the canvas, judged at
    16px rather than at 64. A cross is unmistakable at any size.
  -->
  <defs>
    <clipPath id="r">
      <rect width="64" height="64" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#15428D"/>
    <g>
      <rect x="26" y="12" width="12" height="40" fill="#ffffff"/>
      <rect x="12" y="26" width="40" height="12" fill="#ffffff"/>
    </g>
  </g>
</svg>
